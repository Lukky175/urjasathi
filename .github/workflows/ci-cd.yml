name: UrjaSathi CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # DETECT CHANGES
  # ============================================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3

        with:
          filters: |

            frontend:
              - 'frontend/**'
              - 'deploy/nginx.conf'
              - 'deploy/docker-compose.prod.yml'

            backend:
              - 'backend/**'
              - 'data/**'
              - 'src/**'
              - 'deploy/docker-compose.prod.yml'


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Build and Deploy Frontend

    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Node
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ----------------------------------------------------------
      # Frontend tests/build
      # ----------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


      # ----------------------------------------------------------
      # DockerHub login
      # ----------------------------------------------------------

      - name: Login to DockerHub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-frontend:${{ github.sha }} \
            .


      # ----------------------------------------------------------
      # Push Docker image
      # ----------------------------------------------------------

      - name: Push frontend Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-frontend:${{ github.sha }}


      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ----------------------------------------------------------
      # Find EC2
      # ----------------------------------------------------------

      - name: Find UrjaSathi EC2 instance
        id: ec2
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=urjasathi" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: UrjaSathi EC2 instance not found."
            exit 1
          fi

          echo "Found EC2 instance: $INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Deploy frontend through SSM
      # ----------------------------------------------------------

      - name: Deploy frontend to EC2
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/urjasathi",
              "export IMAGE_TAG=${{ github.sha }}",
              "docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml pull frontend",
              "docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d frontend",
              "docker image prune -f",
              "sleep 10",
              "curl --fail http://localhost/"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --command-id "$COMMAND_ID"

          STATUS=$(aws ssm get-command-invocation \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --command-id "$COMMAND_ID" \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Frontend deployment failed."
            exit 1
          fi


  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Build and Deploy Backend

    needs: changes

    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ----------------------------------------------------------
      # Backend validation
      # ----------------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate backend Python code
        run: |
          python -m compileall backend


      # ----------------------------------------------------------
      # DockerHub login
      # ----------------------------------------------------------

      - name: Login to DockerHub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-backend:${{ github.sha }} \
            .


      # ----------------------------------------------------------
      # Push Docker image
      # ----------------------------------------------------------

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-backend:${{ github.sha }}


      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ----------------------------------------------------------
      # Find EC2
      # ----------------------------------------------------------

      - name: Find UrjaSathi EC2 instance
        id: ec2
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=urjasathi" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: UrjaSathi EC2 instance not found."
            exit 1
          fi

          echo "Found EC2 instance: $INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Deploy backend through SSM
      # ----------------------------------------------------------

      - name: Deploy backend to EC2
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/urjasathi",
              "export IMAGE_TAG=${{ github.sha }}",
              "docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml pull backend",
              "docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d backend",
              "docker image prune -f",
              "sleep 10",
              "curl --fail http://localhost/api/health"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --command-id "$COMMAND_ID"

          STATUS=$(aws ssm get-command-invocation \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --command-id "$COMMAND_ID" \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Backend deployment failed."
            exit 1
          fi