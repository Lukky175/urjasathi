name: UrjaSathi CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # DETECT CHANGES
  # ============================================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'deploy/nginx.conf'
              - 'deploy/docker-compose.prod.yml'

            backend:
              - 'backend/**'
              - 'data/**'
              - 'src/**'
              - 'deploy/docker-compose.prod.yml'


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Build and Deploy Frontend

    needs: changes

    if: >
      github.event_name == 'push' &&
      needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-frontend:${{ github.sha }} \
            .

      - name: Push frontend Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-frontend:${{ github.sha }}

      # ========================================================
      # AWS ACCESS KEY AUTHENTICATION
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find UrjaSathi EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=urjasathi" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: UrjaSathi EC2 instance not found."
            exit 1
          fi

          echo "Found EC2 instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/urjasathi\",\"export IMAGE_TAG=${{ github.sha }}\",\"export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}\",\"docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml pull frontend\",\"docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d frontend\",\"docker image prune -f\",\"sleep 10\",\"curl --fail http://localhost/\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --command-id "$COMMAND_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Frontend deployment failed."

              aws ssm get-command-invocation \
                --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                --command-id "$COMMAND_ID"

              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command."
          exit 1


  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Build and Deploy Backend

    needs: changes

    if: >
      github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate backend Python code
        run: |
          python -m compileall backend

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-backend:${{ github.sha }} \
            .

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/urjasathi-backend:${{ github.sha }}

      # ========================================================
      # AWS ACCESS KEY AUTHENTICATION
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find UrjaSathi EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=urjasathi" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: UrjaSathi EC2 instance not found."
            exit 1
          fi

          echo "Found EC2 instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/urjasathi\",\"export IMAGE_TAG=${{ github.sha }}\",\"export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}\",\"docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml pull backend\",\"docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d backend\",\"docker image prune -f\",\"sleep 10\",\"curl --fail http://localhost/api/health\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --command-id "$COMMAND_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Backend deployment failed."

              aws ssm get-command-invocation \
                --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                --command-id "$COMMAND_ID"

              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command."
          exit 1